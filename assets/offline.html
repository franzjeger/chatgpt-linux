<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Offline</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 1rem;
      background: #212121;
      color: #ececec;
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
      padding: 2rem;
    }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 0; }
    p { margin: 0; color: #9b9b9b; max-width: 34ch; }
    a {
      margin-top: 0.5rem;
      padding: 0.6rem 1.4rem;
      border-radius: 999px;
      background: #ececec;
      color: #212121;
      text-decoration: none;
      font-weight: 500;
    }
    a:hover { background: #fff; }
  </style>
</head>
<body>
  <h1>Can't reach ChatGPT</h1>
  <p>chatgpt.com didn't respond. Check your network connection and try again.</p>
  <a href="https://chatgpt.com/">Retry</a>
</body>
</html>
